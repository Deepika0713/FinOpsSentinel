name: Junie PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  junie-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Junie Code Review
        uses: JetBrains/junie-github-action@v1
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          prompt: "Please conduct a thorough code review of this pull request. Check for bugs, security risks, and logic errors, and post inline comments with recommendations."